[project]
name = "hypercall-sdk"
version = "0.3.0"
description = "Hypercall authenticated sync/async client and generated protocol contracts"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["grpcio==1.76.0", "protobuf==6.33.0"]

[dependency-groups]
dev = [
    "grpcio-tools==1.76.0",
    "hatchling==1.27.0",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/hypercall_proto", "sdk/python/hypercall"]
