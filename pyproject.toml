[project]
name = "hypercall-proto"
version = "0.1.0"
description = "Hypercall private guest protocol and cross-language conformance"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["grpcio==1.76.0", "protobuf==6.33.0"]

[dependency-groups]
dev = ["grpcio-tools==1.76.0", "hatchling==1.27.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/hypercall_proto"]
